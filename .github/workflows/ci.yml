name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU wheels: the runner has no GPU, and the default CUDA build is a ~2GB download.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: ruff check .

      # Only the fast suite (50 tests). The slow ones need ~1GB of weights, and
      # them on every push buys little: they are validated against real hardware in
      # bench/kaggle.ipynb, where a GPU is available to make them meaningful.
      - name: Test
        run: pytest -m "not slow"
