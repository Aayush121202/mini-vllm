[project]
name = "mini-vllm"
version = "0.1.0"
description = "A from-scratch transformer inference engine: paged KV cache, continuous batching, iteration-level scheduling."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "numpy",
]

[project.optional-dependencies]
serving = ["fastapi", "uvicorn[standard]", "pydantic>=2"]
dev = ["pytest>=8", "pytest-timeout", "ruff", "httpx", "fastapi", "uvicorn[standard]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mini_vllm*"]

[tool.setuptools.package-data]
mini_vllm = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requires downloading model weights"]

[tool.ruff]
line-length = 100
